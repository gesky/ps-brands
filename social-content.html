<script>
const PROJECTS = {
  "performa-house": {
    title: "Performa House",
    desc: "Performa House é uma agência situada em Miami, FL onde seu principal objetivo é gerar leads de alta qualidade e conversão para empresas do ramo de home-improvement. Uma comunicação mais arrojada e com cores de alto contraste trouxe um tom moderno e de autoridade para a marca, trazendo para perto um conteúdo que comunica diretamente com as dores e objeções do público-alvo.",
    images: ["/imagens/social-content/1.%20performa%20house/performa-1.webp","/imagens/social-content/1.%20performa%20house/performa-2.webp","/imagens/social-content/1.%20performa%20house/performa-3.webp","/imagens/social-content/1.%20performa%20house/performa-4.webp","/imagens/social-content/1.%20performa%20house/performa-5.webp","/imagens/social-content/1.%20performa%20house/performa-6.webp"]
  },
  "de-martino-contabilidade": {
    title: "De Martino Contabilidade",
    desc: "A De Martino é uma empresa de contabilidade de renome na região de Bauru/SP. Para fortalecer esse posicionamento, desenvolvemos a campanha \"Contabilidade que vale mais\", com foco em destacar o valor estratégico da contabilidade para as empresas. A comunicação reforça a De Martino como uma referência para negócios que buscam uma gestão financeira mais organizada, preparada para crescimento, expansão e tomada de decisões com mais segurança.",
    images: ["/imagens/social-content/2.%20de%20martino/de-martino-1.webp","/imagens/social-content/2.%20de%20martino/de-martino-2.webp","/imagens/social-content/2.%20de%20martino/de-martino-3.webp","/imagens/social-content/2.%20de%20martino/de-martino-4.webp","/imagens/social-content/2.%20de%20martino/de-martino-5.webp","/imagens/social-content/2.%20de%20martino/de-martino-6.webp"]
  },
  "medcontrol": {
    title: "MedControl",
    desc: "A MedControl é uma empresa especializada em soluções e produtos para a área da saúde. Para fortalecer sua presença e comunicar seu diferencial no mercado, desenvolvemos uma estratégia de comunicação focada em transmitir confiança, precisão e profissionalismo. A proposta valoriza a MedControl como uma parceira essencial para clínicas, hospitais e profissionais que buscam qualidade, organização e eficiência em seus processos e equipamentos.",
    images: ["/imagens/social-content/3.%20medcontrol/medcontrol-1.webp","/imagens/social-content/3.%20medcontrol/medcontrol-2.webp","/imagens/social-content/3.%20medcontrol/medcontrol-3.webp","/imagens/social-content/3.%20medcontrol/medcontrol-4.webp","/imagens/social-content/3.%20medcontrol/medcontrol-5.webp","/imagens/social-content/3.%20medcontrol/medcontrol-6.webp"]
  },
  "sterilow": {
    title: "SteriLow",
    desc: "A SteriLow é uma empresa voltada para soluções em esterilização de equipamentos hospitalares. Para fortalecer sua comunicação, desenvolvemos materiais que destacam seus diferenciais técnicos e seu compromisso com qualidade e confiabilidade. A proposta posiciona a SteriLow como uma marca alinhada às exigências do setor, transmitindo credibilidade para profissionais e instituições que buscam processos mais seguros e eficientes.",
    images: ["/imagens/social-content/4.%20sterilow/sterilow-1.webp","/imagens/social-content/4.%20sterilow/sterilow-2.webp","/imagens/social-content/4.%20sterilow/sterilow-3.webp","/imagens/social-content/4.%20sterilow/sterilow-4.webp","/imagens/social-content/4.%20sterilow/sterilow-5.webp","/imagens/social-content/4.%20sterilow/sterilow-6.webp"]
  },
  "reserva-conforto": {
    title: "Reserva Conforto",
    desc: "A Reserva Conforto é o primeiro empreendimento da região com esse conceito, marcando um novo momento no desenvolvimento imobiliário local. Durante o lançamento, desenvolvemos a produção de conteúdo para as redes sociais com o objetivo de fortalecer uma comunicação unificada e estratégica. Esse trabalho ajudou a ampliar a percepção de valor do projeto, contribuir para a conversão de vendas e manter compradores e interessados acompanhando de perto a evolução do empreendimento.",
    images: ["/imagens/social-content/5.%20conforto/conforto-1.webp","/imagens/social-content/5.%20conforto/conforto-2.webp","/imagens/social-content/5.%20conforto/conforto-3.webp","/imagens/social-content/5.%20conforto/conforto-4.webp","/imagens/social-content/5.%20conforto/conforto-5.webp","/imagens/social-content/5.%20conforto/conforto-6.webp"]
  }
};

function render() {
  const slug = new URLSearchParams(window.location.search).get('p');
  const proj = PROJECTS[slug];

  if (!proj) {
    document.getElementById('proj-main').innerHTML = '<div class="container" style="padding-block:4rem"><p>Projeto não encontrado.</p></div>';
    return;
  }

  document.getElementById('page-title').textContent = proj.title + ' — Pedro Spadotto Studio';
  document.getElementById('page-desc').setAttribute('content', 'Social content ' + proj.title + ' por Pedro Spadotto.');

  const imgsHtml = proj.images.map(src => `<img alt="${proj.title}" loading="lazy" src="${src}"/>`).join('\n');

  document.getElementById('proj-main').innerHTML = `
    <div class="container">
      <div class="social-proj-header">
        <h1 class="social-proj-title">${proj.title}</h1>
        <p class="social-proj-desc">${proj.desc}</p>
      </div>
      <div class="social-proj-grid">${imgsHtml}</div>
    </div>
    <section class="project-cta container">
      <p class="project-cta-title" data-i18n="cta.title">Fico feliz que meu trabalho tenha chamado sua atenção!</p>
      <p class="project-cta-sub" data-i18n="cta.sub1">Sinta-se à vontade para entrar em contato pelo WhatsApp abaixo.</p>
      <p class="project-cta-sub">E se ainda tiver alguma dúvida, não hesite em falar comigo.</p>
      <a class="project-cta-email" href="https://wa.me/5514991732262" target="_blank" rel="noopener">Falar no WhatsApp</a>
    </section>`;
}

render();
</script>
