function render() {
  const slug = new URLSearchParams(window.location.search).get('p');
  const proj = PROJECTS[slug];

  if (!proj) {
    document.getElementById('proj-main').innerHTML = '<div class="container" style="padding-block:4rem"><p>Projeto não encontrado.</p></div>';
    return;
  }

  document.getElementById('page-title').textContent = proj.title + ' — Pedro Spadotto Studio';
  document.getElementById('page-desc').setAttribute('content', 'Projeto de identidade visual ' + proj.title + ' por Pedro Spadotto.');

  const parasHtml = proj.paras.map(p => `<p>${p}</p>`).join('\n');
  const imgsHtml  = proj.images.map(src => `<img alt="${proj.title}" loading="lazy" src="${src}"/>`).join('\n');

  document.getElementById('proj-main').innerHTML = `
    <div class="container">
      <div class="proj-header">
        <div class="proj-left">
          <h1 class="proj-title">${proj.title}</h1>
          <dl class="proj-meta">
            <div class="proj-meta-item"><dt>Projeto</dt><dd>${proj.projeto}</dd></div>
            <div class="proj-meta-item"><dt>Entregas</dt><dd>${proj.entregas}</dd></div>
            <div class="proj-meta-item"><dt>Créditos</dt><dd>${proj.creditos}</dd></div>
          </dl>
        </div>
        <div class="proj-right">${parasHtml}</div>
      </div>
    </div>
